model:
  batch_size: 32
  vocab_size: 50304
  max_seq_len: 2048
  d_model: 768
  d_hidden: 3072
  n_heads: 12
  n_layers: 20
  theta: 10000.0
  eps: 1e-5
  kv_latent_dim: 128
  q_latent_dim: 128   
  qk_nope_head_dim: 64
  qk_rope_head_dim: 64
  v_head_dim: 128

optimization:
  lr: 3e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]

data: 
  grad_clip: 1.0
  checkpoint_dir: "./checkpoints"
  compile_model: true
  n_workers: 4
  pin_memory: true
  precision: "high"
  backend: "nccl"
  owt:
    data_dir: "./data/processed/owt"
    random_sample: true
    log_every: 500
    val_every: 5000
    save_every: 5000
  sni:
    data_dir: "./data/processed/sni"
    num_examples: 1_900_000
    val_ratio: 0.1
    log_every: 100
    val_every: 10000
    save_every: 1000
  gsm8k:
    data_dir: "./data/processed/gsm8k"
    log_every: 100
    val_every: 1000
    save_every: 2500
